<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ummjjutube</title>
<meta name="description" content="유튜브·사운드클라우드 링크로 모아 듣는 개인 음악 목록">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8E%A7%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./assets/css/app.css?v=10">
</head>
<body data-route="list">

<header class="top">
  <div class="top-left" id="top-left"></div>
  <a class="brand" id="brand" href="#/">ummjjutube</a>
  <div class="top-right" id="top-right"></div>
</header>

<main class="wrap" id="view"></main>

<!--
  화면(목록·상세·등록)이 바뀌어도 재생이 끊기지 않도록, 재생기 iframe 은
  어떤 화면에도 속하지 않는 이 요소 안에서 계속 살아 있는다.
  위치만 현재 화면의 [data-embed-anchor] 박스에 맞춰 옮긴다.
-->
<div class="embeds" id="embeds" hidden>
  <div id="yt-frame"></div>
  <iframe id="sc-frame" title="SoundCloud 재생기" allow="autoplay" scrolling="no"></iframe>
</div>

<!-- 목록·등록 화면의 하단 고정 플레이어 -->
<section id="player" class="player" aria-label="플레이어" hidden>
  <a class="p-media" id="p-media" href="#/" data-embed-anchor aria-label="재생 중인 곡 열기">
    <img id="p-cover" class="p-cover" alt="" hidden>
  </a>

  <div class="p-info">
    <a class="p-title" id="p-title" href="#/">—</a>
    <div class="p-sub"><span id="p-artist"></span></div>
    <div class="p-status" id="p-status" role="status"></div>
  </div>

  <div class="p-controls">
    <button id="p-prev" class="icon-btn" type="button" aria-label="이전 트랙">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6h2v12H7zm3 6 8-6v12z"/></svg>
    </button>
    <button id="p-toggle" class="icon-btn play-btn" type="button" aria-label="재생">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l12 7-12 7z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
    </button>
    <button id="p-next" class="icon-btn" type="button" aria-label="다음 트랙">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6h2v12h-2zM6 6l8 6-8 6z"/></svg>
    </button>
  </div>

  <div class="p-seek">
    <span id="p-cur" class="time">0:00</span>
    <input id="p-seek" class="range" type="range" min="0" max="1" value="0" step="1" aria-label="재생 위치">
    <span id="p-dur" class="time">--:--</span>
  </div>

  <div class="p-extra">
    <svg class="vol-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h3l5-4v14l-5-4H4zm11.5-.5a4 4 0 0 1 0 7v-2a2 2 0 0 0 0-3z"/></svg>
    <input id="p-vol" class="range vol" type="range" min="0" max="100" value="80" aria-label="음량">
  </div>
</section>

<!-- ---------- 화면 틀 ---------- -->

<template id="tpl-list">
  <div id="notice" class="notice" hidden></div>
  <ul id="grid" class="grid" aria-busy="true"></ul>
  <p id="state" class="state">목록을 불러오는 중…</p>
</template>

<template id="tpl-track">
  <section class="track">
    <div class="track-cover" data-embed-anchor>
      <img id="t-cover" alt="" hidden>
    </div>

    <div class="track-meta">
      <h1 class="track-title" id="t-title"></h1>
      <p class="track-artist" id="t-artist"></p>
    </div>

    <div class="track-seek">
      <input id="t-seek" class="range bare" type="range" min="0" max="1" value="0" step="1" aria-label="재생 위치">
      <div class="track-times">
        <span id="t-cur" class="time">0:00</span>
        <span id="t-dur" class="time">--:--</span>
      </div>
    </div>

    <div class="track-controls">
      <button id="t-prev" class="icon-btn" type="button" aria-label="이전 트랙">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6h2v12H7zm3 6 8-6v12z"/></svg>
      </button>
      <button id="t-toggle" class="icon-btn play-btn" type="button" aria-label="재생">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l12 7-12 7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
      </button>
      <button id="t-next" class="icon-btn" type="button" aria-label="다음 트랙">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6h2v12h-2zM6 6l8 6-8 6z"/></svg>
      </button>
    </div>

    <p class="track-status" id="t-status" role="status"></p>
  </section>
</template>

<template id="tpl-add">
  <div id="notice" class="notice" hidden></div>

  <form id="form" class="form" novalidate>
    <div class="field">
      <label for="f-url">url <span class="req">*</span></label>
      <input id="f-url" class="input" type="url" inputmode="url" placeholder="Youtube or Soundcloud URL" required>
    </div>

    <div class="field">
      <label for="f-title">title <span class="req">*</span></label>
      <input id="f-title" class="input" type="text" maxlength="200" required>
    </div>

    <div class="field">
      <label for="f-artist">artist <span class="req">*</span></label>
      <input id="f-artist" class="input" type="text" maxlength="200" required>
    </div>

    <div class="field">
      <label for="f-cover">image</label>
      <input id="f-cover" class="input file" type="file" accept="image/*">
      <div class="cover-preview">
        <img id="cover-img" alt="커버 미리보기" hidden>
        <span id="cover-ph" class="cover-ph">미리보기</span>
      </div>
    </div>

    <div class="actions">
      <button id="submit" class="btn btn-primary" type="submit">save</button>
    </div>
  </form>
</template>

<template id="tpl-login">
  <section class="auth">
    <div id="notice" class="notice" hidden></div>

    <div id="signed-out">
      <form id="login-form" class="form">
        <div class="field">
          <label for="l-id">id</label>
          <input id="l-id" class="input" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="l-pw">password</label>
          <input id="l-pw" class="input" type="password" autocomplete="current-password" required>
        </div>
        <div class="actions">
          <button id="l-submit" class="btn btn-primary" type="submit">login</button>
        </div>
      </form>
    </div>

    <div id="signed-in" hidden>
      <p class="auth-who"><strong id="who-nick"></strong><span id="who-id" class="muted-inline"></span></p>
      <div class="actions">
        <a id="go-admin" class="btn" href="#/admin" hidden>admin</a>
        <button id="logout" class="btn" type="button">logout</button>
      </div>
    </div>
  </section>
</template>

<template id="tpl-admin">
  <div id="notice" class="notice" hidden></div>

  <section class="admin">
    <h2 class="sec-title">new account</h2>
    <form id="user-form" class="form">
      <div class="field">
        <label for="u-id">id</label>
        <input id="u-id" class="input" type="text" autocapitalize="off" spellcheck="false" placeholder="영문 소문자·숫자·_.- (3~30자)" required>
      </div>
      <div class="field">
        <label for="u-pw">password</label>
        <input id="u-pw" class="input" type="text" autocomplete="new-password" placeholder="6자 이상" required>
      </div>
      <div class="field">
        <label for="u-nick">nickname</label>
        <input id="u-nick" class="input" type="text" maxlength="40" required>
      </div>
      <div class="field">
        <label for="u-role">role</label>
        <select id="u-role" class="input">
          <option value="member">일반</option>
          <option value="admin">관리자</option>
        </select>
      </div>
      <div class="actions">
        <button id="u-submit" class="btn btn-primary" type="submit">create</button>
      </div>
    </form>

    <h2 class="sec-title">members</h2>
    <ul id="members" class="members"></ul>
  </section>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script src="./assets/js/config.js?v=10"></script>
<script src="./assets/js/sources.js?v=10"></script>
<script src="./assets/js/db.js?v=10"></script>
<script src="./assets/js/auth.js?v=10"></script>
<script src="./assets/js/player.js?v=10"></script>
<script src="./assets/js/add.js?v=10"></script>
<script src="./assets/js/app.js?v=10"></script>
</body>
</html>
