<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ummjjutube</title>
<meta name="description" content="유튜브·사운드클라우드 링크로 모아 듣는 개인 음악 목록">
<link rel="icon" href="./favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/icon-32.png?v=39">
<link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/icon-16.png?v=39">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png?v=39">
<link rel="manifest" href="./manifest.webmanifest?v=39">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ummjjutube">
<link rel="stylesheet" href="./assets/css/app.css?v=39">
</head>
<body data-route="list">

<header class="top">
  <div class="top-left" id="top-left"></div>
  <a class="brand" id="brand" href="#/">ummjjutube</a>
  <div class="top-right" id="top-right"></div>
</header>

<main class="wrap" id="view"></main>

<!--
  화면(목록·상세·등록)이 바뀌어도 재생이 끊기지 않도록, 재생기 iframe 은
  어떤 화면에도 속하지 않는 이 요소 안에서 계속 살아 있는다.
  위치만 현재 화면의 [data-embed-anchor] 박스에 맞춰 옮긴다.
-->
<div class="embeds" id="embeds">
  <div id="yt-frame"></div>
  <iframe id="sc-frame" title="SoundCloud 재생기" allow="autoplay" scrolling="no"></iframe>
</div>

<!-- 목록·등록 화면의 하단 고정 플레이어 -->
<section id="player" class="player" aria-label="플레이어" hidden>
  <a class="p-media" id="p-media" href="#/" data-embed-anchor aria-label="재생 중인 곡 열기">
    <img id="p-cover" class="p-cover" alt="" hidden>
  </a>

  <div class="p-info">
    <a class="p-title flow" id="p-title" href="#/"><span class="flow-in" id="p-title-t">—</span></a>
    <div class="p-sub flow"><span class="flow-in" id="p-artist"></span></div>
    <div class="p-status" id="p-status" role="status"></div>
  </div>

  <div class="p-controls">
    <button id="p-prev" class="icon-btn" type="button" aria-label="이전 트랙">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6h2v12H7zm3 6 8-6v12z"/></svg>
    </button>
    <button id="p-toggle" class="icon-btn play-btn" type="button" aria-label="재생">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l12 7-12 7z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
    </button>
    <button id="p-next" class="icon-btn" type="button" aria-label="다음 트랙">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6h2v12h-2zM6 6l8 6-8 6z"/></svg>
    </button>
  </div>

  <!-- 본문과 플레이어 사이 경계선이 곧 재생 바다 -->
  <div class="p-seek">
    <input id="p-seek" class="range bare edge" type="range" min="0" max="1" value="0" step="1" aria-label="재생 위치">
  </div>

  <div class="p-extra">
    <svg class="vol-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h3l5-4v14l-5-4H4zm11.5-.5a4 4 0 0 1 0 7v-2a2 2 0 0 0 0-3z"/></svg>
    <input id="p-vol" class="range vol" type="range" min="0" max="100" value="80" aria-label="음량">
  </div>
</section>

<!-- ---------- 화면 틀 ---------- -->

<template id="tpl-list">
  <div id="notice" class="notice" hidden></div>
  <ul id="grid" class="grid" aria-busy="true"></ul>
  <p id="state" class="state">목록을 불러오는 중…</p>
</template>

<template id="tpl-track">
  <section class="track">
    <div class="track-cover" data-embed-anchor>
      <img id="t-cover" alt="" hidden>
    </div>

    <div class="track-meta">
      <div class="track-texts">
        <h1 class="track-title">
          <span class="flow"><span class="flow-in" id="t-title"></span></span><a id="t-out" class="track-out" target="_blank" rel="noopener noreferrer" aria-label="원본에서 듣기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.3 6.4 10.7 5l7 7-7 7-1.4-1.4L14.9 12z"/></svg></a>
        </h1>
        <p class="track-artist flow"><span class="flow-in" id="t-artist"></span></p>
      </div>
      <button id="t-cmt" class="track-cmt" type="button" aria-label="댓글">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.5 11.3c0 3.7-3.8 6.7-8.5 6.7-.86 0-1.69-.1-2.47-.29L4.5 20l1.2-3.4C4.2 15.3 3.5 13.4 3.5 11.3 3.5 7.6 7.3 4.6 12 4.6s8.5 3 8.5 6.7z"/>
        </svg>
        <span id="t-cmt-n" class="cmt-n" hidden></span>
      </button>
    </div>

    <div class="track-seek">
      <input id="t-seek" class="range bare" type="range" min="0" max="1" value="0" step="1" aria-label="재생 위치">
      <div class="track-times">
        <span id="t-cur" class="time">0:00</span>
        <span id="t-dur" class="time">--:--</span>
      </div>
    </div>

    <div class="track-controls">
      <button id="t-prev" class="icon-btn" type="button" aria-label="이전 트랙">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6h2v12H7zm3 6 8-6v12z"/></svg>
      </button>
      <button id="t-toggle" class="icon-btn play-btn" type="button" aria-label="재생">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l12 7-12 7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
      </button>
      <button id="t-next" class="icon-btn" type="button" aria-label="다음 트랙">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6h2v12h-2zM6 6l8 6-8 6z"/></svg>
      </button>
    </div>

    <p class="track-status" id="t-status" role="status"></p>
  </section>
</template>

<template id="tpl-add">
  <div id="notice" class="notice" hidden></div>

  <form id="form" class="form add-form" novalidate>
    <!-- 커버: 라벨 없이 미리보기 영역 자체가 선택 버튼이다 -->
    <button type="button" id="cover-pick" class="cover-pick" aria-label="커버 사진 선택">
      <img id="cover-img" alt="" hidden>
      <span id="cover-ph" class="cover-ph" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M20 5h-3.2l-1.2-1.6a1 1 0 0 0-.8-.4H9.2a1 1 0 0 0-.8.4L7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-8 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>
      </span>
    </button>
    <input id="f-cover" class="hidden-input" type="file" accept="image/*" tabindex="-1" aria-hidden="true">

    <input id="f-url" class="input flat-input" type="url" inputmode="url"
           placeholder="Youtube or Soundcloud URL" aria-label="링크" required>
    <input id="f-title" class="input flat-input" type="text" maxlength="200"
           placeholder="Title" aria-label="제목" required>
    <input id="f-artist" class="input flat-input" type="text" maxlength="200"
           placeholder="Artist" aria-label="아티스트" required>

    <button id="submit" class="btn btn-ink btn-block" type="submit">SAVE</button>
  </form>
</template>

<template id="tpl-login">
  <section class="auth">
    <div id="notice" class="notice" hidden></div>

    <div id="signed-out">
      <form id="login-form" class="form login-form">
        <input id="l-id" class="input flat-input" type="text" placeholder="ID" aria-label="아이디"
               autocomplete="username" autocapitalize="off" spellcheck="false" required>
        <input id="l-pw" class="input flat-input" type="password" placeholder="Password" aria-label="비밀번호"
               autocomplete="current-password" required>
        <button id="l-submit" class="btn btn-ink btn-block" type="submit">SIGN IN</button>
      </form>
    </div>

    <div id="signed-in" hidden>
      <p class="auth-who"><strong id="who-nick"></strong><span id="who-id" class="muted-inline"></span></p>
      <div class="actions">
        <a id="go-admin" class="btn" href="#/admin" hidden>admin</a>
        <button id="logout" class="btn" type="button">logout</button>
      </div>
    </div>
  </section>
</template>

<template id="tpl-admin">
  <div id="notice" class="notice" hidden></div>

  <section class="admin">
    <h2 class="sec-title">new account</h2>
    <form id="user-form" class="form login-form">
      <input id="u-id" class="input flat-input" type="text" placeholder="ID" aria-label="아이디"
             autocapitalize="off" spellcheck="false" required>
      <input id="u-pw" class="input flat-input" type="text" placeholder="Password" aria-label="비밀번호"
             autocomplete="new-password" required>
      <input id="u-nick" class="input flat-input" type="text" placeholder="Nickname" aria-label="닉네임"
             maxlength="40" required>
      <select id="u-role" class="input flat-input" aria-label="역할">
        <option value="member">일반 회원</option>
        <option value="admin">관리자</option>
      </select>
      <button id="u-submit" class="btn btn-ink btn-block" type="submit">CREATE</button>
    </form>

    <h2 class="sec-title">members</h2>
    <ul id="members" class="members"></ul>
  </section>
</template>

<template id="tpl-comments">
  <div class="sheet-back">
    <section class="sheet" role="dialog" aria-modal="true" aria-label="댓글">
      <!-- 아래로 끌어내려 닫는 손잡이 -->
      <div class="sheet-grip" aria-hidden="true"><span></span></div>

      <header class="sheet-head">
        <span class="sheet-title">댓글</span>
        <button class="icon-btn sheet-close" type="button" aria-label="닫기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 10.6 5-5 1.4 1.4-5 5 5 5-1.4 1.4-5-5-5 5L5.6 17l5-5-5-5L7 5.6z"/></svg>
        </button>
      </header>

      <p class="cmt-toast" id="cmt-toast" role="status" hidden></p>
      <ul class="cmt-list" id="cmt-list"></ul>
      <p class="cmt-empty" id="cmt-empty" hidden>아직 댓글이 없습니다.</p>

      <form class="cmt-form" id="cmt-form">
        <div class="cmt-reply-to" id="cmt-reply-to" hidden>
          <span id="cmt-reply-who"></span>
          <button type="button" class="cmt-reply-cancel" id="cmt-reply-cancel" aria-label="답글 취소">취소</button>
        </div>
        <div class="cmt-row">
          <textarea id="cmt-input" class="input flat-input cmt-input" rows="1" maxlength="1000"
                    placeholder="댓글 입력" aria-label="댓글 입력"></textarea>
          <button id="cmt-send" class="cmt-send" type="submit" aria-label="등록" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.3 20.6 22 12 3.3 3.4 3.3 10 16 12 3.3 14z"/></svg>
          </button>
        </div>
      </form>
    </section>
  </div>
</template>

<template id="tpl-crop">
  <div class="crop-back">
    <div class="crop-sheet" role="dialog" aria-modal="true" aria-label="사진 자르기">
      <div class="crop-frame" id="crop-frame">
        <img id="crop-img" alt="" draggable="false">
      </div>
      <p class="crop-hint">끌어서 옮기고, 두 손가락으로 벌려 확대하세요.</p>
      <div class="crop-actions">
        <button id="crop-cancel" class="btn" type="button">취소</button>
        <button id="crop-apply" class="btn btn-ink" type="button">적용</button>
      </div>
    </div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script src="./assets/js/config.js?v=39"></script>
<script src="./assets/js/sources.js?v=39"></script>
<script src="./assets/js/db.js?v=39"></script>
<script src="./assets/js/auth.js?v=39"></script>
<script src="./assets/js/crop.js?v=39"></script>
<script src="./assets/js/comments.js?v=39"></script>
<script src="./assets/js/player.js?v=39"></script>
<script src="./assets/js/add.js?v=39"></script>
<script src="./assets/js/app.js?v=39"></script>
</body>
</html>
